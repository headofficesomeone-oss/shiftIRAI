
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gシフト依頼</title>

<style>
:root {
  font-family: system-ui, "Yu Gothic", sans-serif;
  color: #243047;
  background: #f4f6fa;
}
* { box-sizing: border-box; }

main {
  max-width: 640px;
  margin: 24px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 20px #18243c15;
}
h1 { font-size: 1.5rem; margin: 0 0 10px; }
h2 { font-size: 1.08rem; margin: 0; }

.help {
  color: #58647b;
  font-size: .9rem;
  line-height: 1.6;
}
label {
  display: block;
  margin: 15px 0 6px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  min-height: 50px;
  padding: 12px;
  border: 1px solid #a6b0c0;
  border-radius: 8px;
  font: inherit;
  font-size: 16px;
}
input[type="date"],
input[type="time"] {
  min-width: 0;
  color-scheme: light;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.section {
  border-top: 1px solid #e2e7ef;
  padding-top: 20px;
  margin-top: 22px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.count {
  color: #58647b;
  font-size: .85rem;
}
.date-entry {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 10px 0;
}
.date-entry input { flex: 1; min-width: 0; }

.time-entry {
  border: 1px solid #d5dce8;
  border-radius: 10px;
  padding: 14px;
  margin: 12px 0;
}
.time-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 12px;
  min-height: 50px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled { opacity: .48; cursor: not-allowed; }

.add-btn {
  width: 100%;
  margin-top: 8px;
  background: #e8f0fc;
  border: 1px solid #94b6e5;
  color: #1959aa;
}
.delete-btn {
  background: #b53b3b;
  color: white;
  min-width: 65px;
}
.mode-help {
  color: #64748b;
  font-size: .85rem;
  line-height: 1.5;
}
.summary {
  background: #f1f5f9;
  border-radius: 9px;
  padding: 14px;
  margin-top: 20px;
  line-height: 1.7;
}
.submit-wrap {
  position: sticky;
  bottom: 0;
  background: white;
  padding: 10px 0 max(12px,env(safe-area-inset-bottom));
  border-top: 1px solid #e2e7ef;
  margin-top: 20px;
  z-index: 5;
}
#submitBtn {
  width: 100%;
  min-height: 58px;
  background: #1959aa;
  color: white;
  font-size: 1.08rem;
}
#newBtn {
  display: none;
  width: 100%;
  min-height: 58px;
  background: #15803d;
  color: white;
  margin-top: 12px;
  font-size: 1.05rem;
}
#status {
  margin-top: 14px;
  padding: 12px;
  background: #eff6ff;
  border-radius: 8px;
  line-height: 1.6;
  display: none;
}
@media(max-width:500px) {
  main {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
  .two {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
</style>
</head>

<body>
<main>
<h1>Gシフト依頼</h1>
<p class="help">
支援予定を入力してください。<br>
日付または時間帯を複数登録できます。
</p>

<form id="report" method="post" target="_blank"
 action="https://script.google.com/macros/s/AKfycbzQTgreHVVkHfDWCGfs1CP8kBFwRkGDaBlJC48fv2ZjKQZCUy2B02JiugJbemKX-bWY/exec">

<div class="two">
  <div>
    <label for="reporter">報告者 *</label>
    <input id="reporter" name="reporter"
           required maxlength="100"
           autocomplete="name">
  </div>
  <div>
    <label for="client">利用者 *</label>
    <input id="client" name="client"
           required maxlength="100">
  </div>
</div>

<label for="category">区分 *</label>
<select id="category" name="category" required>
  <option value="">選択してください</option>
  <option>通院（通院介助）</option>
  <option>同行（通院介助）</option>
  <option>身体介護</option>
  <option>家事援助</option>
  <option>同行援護</option>
  <option>移動支援</option>
  <option>訪問介護</option>
  <option>総合事業</option>
  <option>ｷｬﾝｾﾙ</option>
  <option>取り消し</option>
  <option>その他</option>
</select>

<section class="section">
  <div class="section-header">
    <h2>日時（支援予定日） *</h2>
    <span id="dateCount" class="count"></span>
  </div>

  <div id="dateList"></div>

  <button type="button" id="addDate" class="add-btn">
    ＋ 日付を追加
  </button>
  <p id="dateHelp" class="mode-help"></p>
</section>

<section class="section">
  <div class="section-header">
    <h2>時間帯</h2>
    <span id="timeCount" class="count"></span>
  </div>

  <div id="timeList"></div>

  <button type="button" id="addTime" class="add-btn">
    ＋ 時間を追加
  </button>
  <p id="timeHelp" class="mode-help"></p>
</section>

<label for="destination">行き先場所</label>
<input id="destination" name="destination" maxlength="500">

<label for="meeting">待合せ場所</label>
<input id="meeting" name="meeting" maxlength="500">

<label for="notes">特記事項（訪問介護の場合は身体生活の内訳、待合せや受診の予約時間を記入）</label>
<textarea id="notes" name="notes"
          rows="3" maxlength="2000"></textarea>

<input type="hidden" id="supportDates" name="supportDates">
<input type="hidden" id="supportTimes" name="supportTimes">
<input type="hidden" id="requestId" name="requestId">

<div class="summary">
  <strong>登録内容</strong>
  <div id="summaryText"></div>
</div>

<div class="submit-wrap">
  <button type="submit" id="submitBtn">
    まとめて登録する
  </button>
</div>
</form>

<div id="status" role="status"></div>

<button type="button" id="newBtn">
  ＋ 次の依頼を入力
</button>

<p class="help">
登録結果は別タブで表示されます。<br>
「登録しました」と表示されたことを確認してください。
</p>
</main>

<script>
const form = document.getElementById('report');
const dateList = document.getElementById('dateList');
const timeList = document.getElementById('timeList');
const addDateBtn = document.getElementById('addDate');
const addTimeBtn = document.getElementById('addTime');
const submitBtn = document.getElementById('submitBtn');
const newBtn = document.getElementById('newBtn');
const statusBox = document.getElementById('status');
const reporterInput = document.getElementById('reporter');

const MAX_ITEMS = 50;
let submitted = false;

// 報告者を同じタブ内で保持
try {
  reporterInput.value =
    sessionStorage.getItem('gShiftReporter') || '';
} catch (err) {}

reporterInput.addEventListener('input', () => {
  try {
    sessionStorage.setItem(
      'gShiftReporter',
      reporterInput.value
    );
  } catch (err) {}
});

function todayString() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

function dateInputs() {
  return [...dateList.querySelectorAll('input[type=date]')];
}

function timeEntries() {
  return [...timeList.querySelectorAll('.time-entry')];
}

function updateControls() {
  const dc = dateInputs().length;
  const tc = timeEntries().length;

  document.getElementById('dateCount').textContent = dc + '件';
  document.getElementById('timeCount').textContent = tc + '件';

  addDateBtn.disabled = submitted || tc > 1 || dc >= MAX_ITEMS;
  addTimeBtn.disabled = submitted || dc > 1 || tc >= MAX_ITEMS;

  document.getElementById('dateHelp').textContent =
    tc > 1
      ? '時間帯が複数なので、日付は追加できません。'
      : '複数の日付に同じ時間帯を登録できます。';

  document.getElementById('timeHelp').textContent =
    dc > 1
      ? '日付が複数なので、時間は追加できません。'
      : '同じ日付に複数の時間帯を登録できます。';

  document.getElementById('summaryText').textContent =
    (dc > 1
      ? '日付を複数指定'
      : tc > 1
        ? '時間帯を複数指定'
        : '日付1件・時間帯1件') +
    '／登録予定 ' + Math.max(dc, tc) + '行';
}

function addDate(value = '') {
  if (submitted ||
      timeEntries().length > 1 ||
      dateInputs().length >= MAX_ITEMS) return;

  const wrapper = document.createElement('div');
  wrapper.className = 'date-entry';

  const inp = document.createElement('input');
  inp.type = 'date';
  inp.required = true;
  inp.value = value;
  inp.setAttribute('aria-label', '支援予定日');
  wrapper.appendChild(inp);

  if (dateInputs().length > 0) {
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '削除';
    remove.className = 'delete-btn';

    remove.addEventListener('click', () => {
      wrapper.remove();
      updateControls();
    });
    wrapper.appendChild(remove);
  }

  dateList.appendChild(wrapper);
  updateControls();
}

function addTime(start = '', end = '') {
  if (submitted ||
      dateInputs().length > 1 ||
      timeEntries().length >= MAX_ITEMS) return;

  const wrapper = document.createElement('div');
  wrapper.className = 'time-entry';

  const header = document.createElement('div');
  header.className = 'time-header';

  const heading = document.createElement('strong');
  heading.textContent = '時間帯 ' + (timeEntries().length + 1);
  header.appendChild(heading);

  if (timeEntries().length > 0) {
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '削除';
    remove.className = 'delete-btn';

    remove.addEventListener('click', () => {
      wrapper.remove();
      renumberTimes();
      updateControls();
    });
    header.appendChild(remove);
  }

  wrapper.appendChild(header);

  const fields = document.createElement('div');
  fields.className = 'two';

  const startBox = document.createElement('div');
  const startLabel = document.createElement('label');
  startLabel.textContent = '開始時刻 *';
  const startInput = document.createElement('input');
  startInput.type = 'time';
  startInput.required = true;
  startInput.className = 'start-time';
  startInput.value = start;
  startBox.append(startLabel, startInput);

  const endBox = document.createElement('div');
  const endLabel = document.createElement('label');
  endLabel.textContent = '終了予定（任意）';
  const endInput = document.createElement('input');
  endInput.type = 'time';
  endInput.className = 'end-time';
  endInput.value = end;
  endBox.append(endLabel, endInput);

  fields.append(startBox, endBox);
  wrapper.appendChild(fields);
  timeList.appendChild(wrapper);

  updateControls();
}

function renumberTimes() {
  timeEntries().forEach((entry, i) => {
    entry.querySelector('strong').textContent =
      '時間帯 ' + (i + 1);
  });
}

addDateBtn.addEventListener('click', () => addDate());
addTimeBtn.addEventListener('click', () => addTime());

// 初期入力欄
addDate(todayString());
addTime();

// 登録ボタン
form.addEventListener('submit', function(e) {
  if (submitted) {
    e.preventDefault();
    return;
  }

  const dates = dateInputs().map(x => x.value);
  const times = timeEntries().map(entry => ({
    start: entry.querySelector('.start-time').value,
    end: entry.querySelector('.end-time').value
  }));

  if (!dates.length ||
      dates.some(x => !x) ||
      new Set(dates).size !== dates.length) {
    e.preventDefault();
    alert('日付の未入力または重複を確認してください。');
    return;
  }

  if (dates.length > 1 && times.length > 1) {
    e.preventDefault();
    alert('日付と時間帯を同時に複数指定できません。');
    return;
  }

  for (const t of times) {
    if (!t.start || (t.end && t.end <= t.start)) {
      e.preventDefault();
      alert('時間帯の入力を確認してください。');
      return;
    }
  }

  const count = Math.max(dates.length, times.length);

  if (!confirm(count + '件の依頼を登録します。よろしいですか？')) {
    e.preventDefault();
    return;
  }

  document.getElementById('supportDates').value =
    JSON.stringify(dates);
  document.getElementById('supportTimes').value =
    JSON.stringify(times);
  document.getElementById('requestId').value =
    crypto.randomUUID();

  try {
    sessionStorage.setItem(
      'gShiftReporter',
      reporterInput.value
    );
  } catch (err) {}

  submitted = true;

  // 標準のフォームPOST送信を妨げないよう、
  // 送信開始後にボタンをロックする
  setTimeout(() => {
    submitBtn.disabled = true;
    submitBtn.textContent = '送信済み';
    updateControls();

    statusBox.style.display = 'block';
    statusBox.textContent =
      '送信しました。別タブで登録結果を確認してください。';

    // 次の依頼を入力する操作を表示
    newBtn.style.display = 'block';

    // ボタンが見えるように移動
    newBtn.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }, 0);
});

// 次の依頼を入力
newBtn.addEventListener('click', () => {

  if (!confirm(
    '別タブで登録結果を確認しましたか？\n' +
    '次の依頼の入力を開始します。'
  )) {
    return;
  }

  // 報告者名を退避
  const lastReporter = reporterInput.value;

  // フォーム初期化
  form.reset();

  // 報告者だけ復元
  reporterInput.value = lastReporter;

  // 日付・時間帯の入力欄を再作成
  dateList.replaceChildren();
  timeList.replaceChildren();

  submitted = false;

  addDate(todayString());
  addTime();

  // 送信管理項目を初期化
  document.getElementById('supportDates').value = '';
  document.getElementById('supportTimes').value = '';
  document.getElementById('requestId').value = '';

  submitBtn.disabled = false;
  submitBtn.textContent = 'まとめて登録する';

  newBtn.style.display = 'none';
  statusBox.style.display = 'none';
  statusBox.textContent = '';

  updateControls();

  // 最初の入力欄へ戻る
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});
</script>
</body>
</html>
