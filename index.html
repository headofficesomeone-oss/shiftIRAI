
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gシフト依頼</title>

<style>
:root {
  font-family: system-ui, "Yu Gothic", sans-serif;
  color: #243047;
  background: #f4f6fa;
}
* { box-sizing: border-box; }

main {
  max-width: 640px;
  margin: 25px auto;
  padding: 22px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 3px 20px #18243c15;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 10px;
}
.help {
  font-size: .9rem;
  color: #58647b;
  line-height: 1.6;
}
label {
  display: block;
  margin: 16px 0 6px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #a6b0c0;
  border-radius: 8px;
  font: inherit;
  font-size: 16px;
  min-height: 50px;
}
input[type="date"], input[type="time"] {
  min-width: 0;
  color-scheme: light;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
button {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 9px;
  padding: 13px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
.date-entry {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 9px 0;
}
.date-entry input {
  flex: 1;
  min-width: 0;
}
.delete-btn {
  width: auto;
  min-width: 70px;
  background: #b53b3b;
  color: white;
}
#addDate {
  background: #e8f0fc;
  color: #1959aa;
  border: 1px solid #94b6e5;
  margin-top: 10px;
}
.submit-wrap {
  position: sticky;
  bottom: 0;
  background: white;
  padding: 10px 0 max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid #e2e7ef;
  margin-top: 22px;
  z-index: 5;
}
#submitBtn {
  background: #1959aa;
  color: white;
  font-size: 1.08rem;
  min-height: 58px;
}
#submitBtn:disabled {
  background: #7c8798;
  cursor: default;
}
#newBtn {
  background: #15803d;
  color: white;
  margin-top: 12px;
  display: none;
}
#status {
  margin-top: 14px;
  font-weight: 600;
  line-height: 1.6;
}
@media(max-width:500px) {
  main {
    margin: 0;
    min-height: 100vh;
    padding: 18px 16px;
    border-radius: 0;
    box-shadow: none;
  }
  .two {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
</style>
</head>

<body>
<main>

<h1>Gシフト依頼</h1>

<p class="help">
支援予定を入力してください。<br>
複数の日付をまとめて登録できます。
</p>

<form
  id="report"
  method="post"
  target="_blank"
  action="https://script.google.com/macros/s/AKfycbzQTgreHVVkHfDWCGfs1CP8kBFwRkGDaBlJC48fv2ZjKQZCUy2B02JiugJbemKX-bWY/exec"
>

<div class="two">
  <div>
    <label for="reporter">報告者 *</label>
    <input id="reporter" name="reporter"
      required maxlength="100">
  </div>

  <div>
    <label for="client">利用者 *</label>
    <input id="client" name="client"
      required maxlength="100">
  </div>
</div>

<label for="category">区分 *</label>
<select id="category" name="category" required>
  <option value="">選択してください</option>
  <option>通院（通院介助）</option>
  <option>同行（通院介助）</option>
  <option>身体介護</option>
  <option>家事援助</option>
  <option>同行援護</option>
  <option>移動支援</option>
  <option>重度訪問介護</option>
  <option>取り消し</option>
  <option>その他</option>
</select>

<label>日時（支援予定日） *</label>
<p class="help">
「＋ 日付を追加」で複数日を指定できます。
</p>

<div id="dateList"></div>

<button type="button" id="addDate">
＋ 日付を追加
</button>

<input type="hidden"
  name="supportDates"
  id="supportDates">

<input type="hidden"
  name="requestId"
  id="requestId">

<div class="two">
  <div>
    <label for="startTime">開始時刻 *</label>
    <input id="startTime" name="startTime"
      type="time" required>
  </div>

  <div>
    <label for="endTime">終了予定（任意）</label>
    <input id="endTime" name="endTime"
      type="time">
  </div>
</div>

<label for="destination">行き先場所</label>
<input id="destination"
  name="destination"
  maxlength="500">

<label for="meeting">待合せ場所</label>
<input id="meeting"
  name="meeting"
  maxlength="500">

<label for="notes">特記事項</label>
<textarea id="notes"
  name="notes"
  rows="3"
  maxlength="2000"></textarea>

<div class="submit-wrap">
  <button type="submit" id="submitBtn">
    まとめて登録する
  </button>
</div>

</form>

<div id="status" role="status"></div>

<button type="button" id="newBtn">
＋ 新しい依頼を入力
</button>

<p class="help">
登録結果は別タブに表示されます。<br>
必ず「登録しました」と表示されたことを
確認してください。
</p>

</main>

<script>
const form = document.getElementById('report');
const list = document.getElementById('dateList');
const submitBtn = document.getElementById('submitBtn');
const newBtn = document.getElementById('newBtn');
const status = document.getElementById('status');

let submitted = false;

// 日付欄を追加
function addDate(value = '') {

  if (list.children.length >= 50) {
    alert('日付は最大50件です。');
    return;
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'date-entry';

  const inp = document.createElement('input');
  inp.type = 'date';
  inp.required = true;
  inp.value = value;
  inp.setAttribute('aria-label', '支援予定日');

  wrapper.appendChild(inp);

  if (list.children.length > 0) {
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '削除';
    remove.className = 'delete-btn';

    remove.addEventListener('click', () => {
      wrapper.remove();
    });

    wrapper.appendChild(remove);
  }

  list.appendChild(wrapper);
}

// 日付追加ボタン
document.getElementById('addDate')
  .addEventListener('click', () => addDate());

// 初期日付は今日
function todayString() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

addDate(todayString());

// 送信処理
form.addEventListener('submit', function(e) {

  if (submitted) {
    e.preventDefault();
    return;
  }

  const dates = [
    ...list.querySelectorAll('input[type="date"]')
  ].map(x => x.value);

  if (
    dates.length === 0 ||
    dates.some(d => !d) ||
    new Set(dates).size !== dates.length
  ) {
    e.preventDefault();
    alert('日付の未入力・重複を確認してください。');
    return;
  }

  const start = this.elements.startTime.value;
  const end = this.elements.endTime.value;

  if (end && end <= start) {
    e.preventDefault();
    alert('終了予定は開始時刻より後にしてください。');
    return;
  }

  const message =
    dates.length + '件の依頼を登録します。\n\n' +
    '報告者：' + this.elements.reporter.value + '\n' +
    '利用者：' + this.elements.client.value + '\n' +
    '区分：' + this.elements.category.value + '\n' +
    '開始：' + start + '\n\n' +
    'よろしいですか？';

  if (!confirm(message)) {
    e.preventDefault();
    return;
  }

  document.getElementById('supportDates').value =
    JSON.stringify(dates);

  // 同じ入力内容の再送信に備えて送信IDを設定
  const idField = document.getElementById('requestId');
  if (!idField.value) {
    idField.value = crypto.randomUUID();
  }

  submitted = true;

  // フォームの送信処理後にボタンを無効化
  setTimeout(() => {
    submitBtn.disabled = true;
    submitBtn.textContent = '送信済み';
    newBtn.style.display = 'block';
    status.textContent =
      '送信しました。別タブで登録結果を確認してください。';
  }, 0);
});

// 新規入力
newBtn.addEventListener('click', () => {

  if (!confirm(
    '別タブで登録結果を確認しましたか？\n' +
    '新しい入力を開始します。'
  )) return;

  form.reset();

  list.replaceChildren();
  addDate(todayString());

  document.getElementById('supportDates').value = '';
  document.getElementById('requestId').value = '';

  submitted = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'まとめて登録する';

  newBtn.style.display = 'none';
  status.textContent = '';

  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>

</body>
</html>
